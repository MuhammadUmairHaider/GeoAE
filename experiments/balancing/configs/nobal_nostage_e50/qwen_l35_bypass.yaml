# 50 EPOCHS (user, 12 Oct 11:05 EDT: "if we dont need 100 we can limit to 50"): n_epochs 100 -> 50, checkpoints ..._nobal_nostage_e50;
extraction:
  model_name: Qwen/Qwen2.5-3B
data:
  activations_dir: activations_qwen2_5_3b_l35_struct5_train10M
  target_layer: 35
  batch_size: 32768
  val_frac: 0.05
model:
  hidden_size: 2048
  latent_dim: 4096
  latent_norm: batch
  n_clusters: 2000
  nonlinearity: gelu
  metric: euclidean
  token_bias: e2e/checkpoints/general/qwen2.5-3B/layer35/token_bias_struct5_train10M.npz
  dist_scale: raw
  token_bias_mode: bypass
loss:
  lambda_cluster: 1.0
  lambda_sep: 0.3
  sep_mode: hinge
  sep_margin: 2.0
  lambda_var: 1.0
  lambda_cov: 0.01
  lambda_unif: 0.0
  lambda_usage: 0.05
  lambda_mse: 0.0
  balance: none
  balance_rho: 0.6
  balance_eta: 0.05
  zipf_alpha_start: 0.0
  zipf_alpha_end: 0.5
  sinkhorn_iters: 3
  tau_start: 1.0
  tau_end: 0.1
  var_gamma: 1.0
  lambda_sup: 0.0
train:
  n_epochs: 50
  lr: 0.00028
  recon_only_epochs: 0
  geometry_start_epoch: 1
  clustering_start_epoch: 1
  full_loss_start_epoch: 1
  ema_decay: 0.9
  ema_hard: true
  centroid_init: dpc
  density_power: 1.0
  density_pool: 32768
  density_knn: 32
  peak_min_sep_frac: 0.25
  peak_refine_k: 8
  reinit_mode: peaks
  peak_reinit_pool: 8192
  checkpoints_dir: checkpoints/qwen2.5-3B/layer35/k2000_bnh_b32k_lam1_d4096_dpc_struct5_train10M_tokbias_nobal_nostage_e50
  diag_every: 144
  reinit_every: 125
  reinit_threshold: 0.05
  save_every: 1
  keep_checkpoints: 4
  keep_every_epochs: 10
  seed: 42
  wandb_project: geoae-qwen2.5-3b
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0
  grad_clip: 1.0
  sup_frac: 0.0
  freeze: none
