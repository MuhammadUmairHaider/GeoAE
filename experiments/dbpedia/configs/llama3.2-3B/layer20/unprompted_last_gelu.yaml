data:
  activations_dir: "dbpedia/activations/llama3.2-3B/last/unprompted"
  target_layer: 20
  batch_size: 512
  val_frac: 0.05

model:
  hidden_size: 3072
  latent_dim: 3072
  n_clusters: 14
  nonlinearity: gelu

loss:
  lambda_cluster: 0.01
  lambda_sep: 0.005
  lambda_usage: 0.05
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 100
  recon_only_epochs: 10
  clustering_start_epoch: 11
  full_loss_start_epoch: 15
  checkpoints_dir: "dbpedia/checkpoints/llama3.2-3B/layer20/unprompted_last_gelu"
  diag_every: 100
  reinit_every: 1000
  seed: 42
  wandb_project: "geosep-dbpedia"
