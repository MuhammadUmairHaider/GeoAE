# Gemma 3 1B PT L25 (last block of 26), K=2000, d2304 (2x d_model=1152), dpc, sampled struct5 dump — TOKEN BYPASS (design B).
extraction:
  model_name: "google/gemma-3-1b-pt"   # metadata only — no LM is loaded here

data:
  activations_dir: "activations_gemma3_1b_sampled_struct5_10M"
  target_layer: 25
  batch_size: 32768
  val_frac: 0.05

model:
  hidden_size: 1152
  latent_dim: 2304
  latent_norm: "batch"
  n_clusters: 2000
  nonlinearity: gelu
  metric: euclidean
  token_bias: "e2e/checkpoints/general/gemma3-1B/layer25/token_bias_sampled_struct5.npz"
loss:
  lambda_cluster: 1.0
  lambda_sep: 0.3
  sep_mode: "hinge"
  sep_margin: 2.0
  lambda_var: 1.0
  lambda_cov: 0.01
  lambda_unif: 0.0
  lambda_usage: 0.05
  lambda_mse: 0.0

  balance: "zipf"
  balance_rho: 0.6
  balance_eta: 0.05
  zipf_alpha_start: 0.0
  zipf_alpha_end: 0.5

  sinkhorn_iters: 3
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 50
  lr: 2.8e-4
  recon_only_epochs: 10
  geometry_start_epoch: 6
  clustering_start_epoch: 11
  full_loss_start_epoch: 11
  ema_decay: 0.9
  ema_hard: true
  centroid_init: "dpc"
  density_power: 1.0
  density_pool: 32768
  density_knn: 32
  peak_min_sep_frac: 0.25
  peak_refine_k: 8
  reinit_mode: "peaks"
  peak_reinit_pool: 8192
  checkpoints_dir: "checkpoints/gemma3-1B/layer25/k2000_bnh_b32k_lam1_d2304_dpc_sampled_struct5_tokbias"
  diag_every: 12
  reinit_every: 125
  save_every: 1
  keep_checkpoints: 12
  seed: 42
  wandb_project: "geoae-gemma3-1b"
