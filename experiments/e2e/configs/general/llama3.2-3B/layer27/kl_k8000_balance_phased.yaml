# Llama-3.2-3B L27 KL — K=8000 ARM.  Parent: kl_gelu_k2000_balance_phased.
extraction:
  model_name: "meta-llama/Llama-3.2-3B"

data:
  activations_dir: "activations_diverse_10M"
  target_layer: 27
  batch_size: 8192
  val_frac: 0.05

model:
  hidden_size: 3072
  latent_dim: 3072
  n_clusters: 8000
  nonlinearity: gelu
  metric: euclidean

loss:
  lambda_cluster: 0.05
  lambda_sep: 0.005
  lambda_mse: 0.1
  lambda_var: 0.3              # now actually applied — see note above
  lambda_cov: 0.001
  lambda_unif: 0.0             # euclidean run: uniformity is for the cosine geometry
  lambda_usage: 0.05           # unused by the e2e loss; config parity

  balance: "zipf"
  balance_rho: 0.6
  balance_eta: 0.05
  zipf_alpha_start: 0.0
  zipf_alpha_end: 0.5

  sinkhorn_iters: 3
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 50
  lr: 2.0e-4
  recon_only_epochs: 10        # no cluster loss until epoch 11 (lambda_schedule gate)
  geometry_start_epoch: 6      # epochs 6-10 : + VICReg (var/cov), clustering still off
  clustering_start_epoch: 11   # epochs 11+   : + cluster loss, centroids kmeans++ seeded
  full_loss_start_epoch: 11    # sep ramps from 0; tau and zipf_alpha anneal from here
  ema_decay: 0.9
  ema_hard: true
  teacher_mode: "onfly"        # layer 27 is the last block: teacher = lm_head(norm(x)) in-loop.
  centroid_init: "kmeans++"
  checkpoints_dir: "e2e/checkpoints/general/llama3.2-3B/layer27/kl_k8000_balance_phased"
  save_every: 1
  keep_checkpoints: 40
  diag_every: 25
  reinit_every: 250
  seed: 42
  wandb_project: "geosep-general-e2e"
