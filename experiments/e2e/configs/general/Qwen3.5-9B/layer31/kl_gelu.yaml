# End-to-end KL — GENERAL corpus, UNSUPERVISED. Qwen3.5-9B, layer 31 (FINAL
extraction:
  model_name: "Qwen/Qwen3.5-9B"           # REQUIRED for e2e — the LLM is in the loop

data:
  activations_dir: "activations_qwen_diverse"   # -> geosep/activations_qwen_diverse (norm stats only)
  target_layer: 31
  batch_size: 256
  val_frac: 0.05

model:
  hidden_size: 4096
  latent_dim: 10240                 # no bottleneck
  n_clusters: 128                  # overridden to 2000 on the CLI
  nonlinearity: gelu

loss:
  lambda_cluster: 0.01
  lambda_sep: 0.005
  lambda_usage: 0.05               # unused by e2e loss; kept for config parity
  lambda_mse: 0.1
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 40
  lr: 2.0e-5
  recon_only_epochs: 5             # "KL-only" warmup (cluster/sep phase in after)
  clustering_start_epoch: 6
  full_loss_start_epoch: 9
  teacher_mode: "onfly"            # ignored by the streaming trainer (always in-loop)
  centroid_init: "kmeans++"
  checkpoints_dir: "e2e/checkpoints/general/Qwen3.5-9B/layer31/kl_gelu_2000"
  diag_every: 100
  reinit_every: 1000
  seed: 42
  wandb_project: "geosep-general-e2e"
