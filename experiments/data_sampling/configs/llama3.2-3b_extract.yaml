# Llama-3.2-3B residual-stream extraction — reproduces activations_diverse_10M.
extraction:
  model_name: "meta-llama/Llama-3.2-3B"
  layers: [27]
  target_layer: 27
  hidden_size: 3072
  n_tokens: 10000000
  dtype: "float16"
  max_doc_tokens: 256
  skip_leading: 4
  activations_dir: "activations_diverse_10M"
  log_every: 200
