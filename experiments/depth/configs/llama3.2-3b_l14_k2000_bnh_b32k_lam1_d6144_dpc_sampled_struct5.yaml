# Matched plain AE: exactly 10M training rows, validation held out separately.
extraction:
  model_name: meta-llama/Llama-3.2-3B
data:
  activations_dir: activations_llama3_3b_l14_sampled_struct5_train10M
  target_layer: 14
  batch_size: 32768
  val_frac: 0.05
model:
  hidden_size: 3072
  latent_dim: 6144
  latent_norm: batch
  n_clusters: 2000
  nonlinearity: gelu
  metric: euclidean
  token_bias: ''
loss:
  lambda_cluster: 1.0
  lambda_sep: 0.3
  sep_mode: hinge
  sep_margin: 2.0
  lambda_var: 1.0
  lambda_cov: 0.01
  lambda_unif: 0.0
  lambda_usage: 0.05
  lambda_mse: 0.0
  balance: zipf
  balance_rho: 0.6
  balance_eta: 0.05
  zipf_alpha_start: 0.0
  zipf_alpha_end: 0.5
  sinkhorn_iters: 3
  tau_start: 1.0
  tau_end: 0.1
train:
  n_epochs: 50
  lr: 0.00028
  recon_only_epochs: 10
  geometry_start_epoch: 6
  clustering_start_epoch: 11
  full_loss_start_epoch: 11
  ema_decay: 0.9
  ema_hard: true
  centroid_init: dpc
  density_power: 1.0
  density_pool: 32768
  density_knn: 32
  peak_min_sep_frac: 0.25
  peak_refine_k: 8
  reinit_mode: peaks
  peak_reinit_pool: 8192
  checkpoints_dir: checkpoints/llama3.2-3B/layer14/k2000_bnh_b32k_lam1_d6144_dpc_sampled_struct5_train10M
  diag_every: 12
  reinit_every: 125
  save_every: 1
  keep_checkpoints: 40
  seed: 42
  wandb_project: geosep-general-e2e
