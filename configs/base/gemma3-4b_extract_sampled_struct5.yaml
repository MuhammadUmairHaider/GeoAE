# Gemma 3 4B PT — SAMPLED-POSITION extraction, 10-source mix (struct5), layer 33 only.
#
# Exact mirror of configs/base/gemma3-1b_extract_sampled_struct5.yaml (same 10 sources, 5%
# structured prompts, 64 random positions per doc of up to 2048 tokens), with the model-driven
# changes:
#   * model google/gemma-3-4b-pt (Gemma3ForConditionalGeneration; text decoder at
#     lm.model.language_model, 34 blocks, hidden 2560 — model.config.hidden_size is WRONG for this
#     wrapper, the real width is in text_config; geoae.lm_arch.hidden_size reads the decoder's)
#   * layer [33] = the LAST block (the only one where the head-only KL/next-token paths are exact)
#   * dtype float32 — MANDATORY: dim 443 is a massive-activation channel that overflows fp16 on
#     ~85% of tokens at L33 (see configs/base/gemma3-4b_extract.yaml)
# Tokenizer is byte-identical to gemma-3-1b-pt (tokenizer.json/.model sha256 equal, 400 corpus docs
# encode identically), so corpus/gemma3_4b_sampled_struct5_v1 is a copy of the 1B corpus with
# manifest model_tokenizer rewritten: the 4B dump sees the same documents as the 1B dump.
#
# Disk: 10M x 2560 x 4 B x 1 layer = 102 GB (+ ~1 GB sidecars/corpus), under $DELTA_DATA
# (Delta: /work/hdd/.../GeoAE/activations/, linked by scripts/delta/link_data.sh; box: the checkout).
# Run: sbatch scripts/delta/extract_gemma4b.sbatch   or   scripts/remote/run_gemma4b.sh (box)

extraction:
  model_name: "google/gemma-3-4b-pt"
  layers: [33]
  target_layer: 33
  hidden_size: 2560
  n_tokens: 10000000
  dtype: "float32"
  activations_dir: "activations_gemma3_4b_sampled_struct5_10M"
  corpus_dir: "corpus/gemma3_4b_sampled_struct5_v1"
  corpus_margin: 1.3
  mode: "sampled"
  context_len: 2048
  positions_per_doc: 64
  skip_leading: 4             # BOS + document-start flood, same as Llama
  batch_docs: 16              # forward stops at the hooked block (extract_sampled._StopForward), so the
                              # 262k-vocab logits are never computed; 16x2048 bf16 activations are ~170 MB/tensor
  shuffle_buffer: 2000        # per source; plus shard-order shuffle. Each open
                              # stream costs ~3-5 GB RSS (Parquet row groups)
  outlier_norm_mult: 0.0      # report only
  log_every: 2000
  sources:
    - {domain: edu_web,  weight: 35,  name: "HuggingFaceFW/fineweb-edu", config: "sample-10BT", field: text}
    - {domain: web,      weight: 15,  name: "HuggingFaceFW/fineweb",     config: "sample-10BT", field: text}
    - {domain: wiki,     weight: 15,  name: "wikimedia/wikipedia",       config: "20231101.en", field: text}
    # Pile long tail (StackExchange, arXiv, PubMed, FreeLaw, USPTO, PG-19, ...);
    # the slices already covered by other sources are excluded.
    - {domain: pile,     weight: 10,  name: "monology/pile-uncopyrighted", field: text,
       shuffle_buffer: 1000,   # docs can be whole books; bound RAM
       exclude: {key: "meta.pile_set_name", values: ["Pile-CC", "Github", "DM Mathematics", "Wikipedia (en)"]}}
    - {domain: code,     weight: 8,   name: "codeparrot/codeparrot-clean", field: content}
    - {domain: math,     weight: 5,   name: "HuggingFaceTB/finemath",   config: "finemath-4plus", field: text}
    - {domain: wiki_de,  weight: 3,   name: "wikimedia/wikipedia",       config: "20231101.de", field: text}
    - {domain: wiki_fr,  weight: 2,   name: "wikimedia/wikipedia",       config: "20231101.fr", field: text}
    - {domain: wiki_es,  weight: 2,   name: "wikimedia/wikipedia",       config: "20231101.es", field: text}
    - {domain: structured, weight: 5, kind: structured, items_per_doc: 8}
