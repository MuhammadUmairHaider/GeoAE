# Default config — override only what differs from dataclass defaults.
# All values here mirror the dataclass defaults; edit to customize a run.

extraction:
  model_name: "meta-llama/Llama-3.2-3B"
  layers: [16, 20, 24, 27]
  target_layer: 27
  hidden_size: 3072
  pack_size: 16384
  skip_first_n: 8
  n_tokens: 5000000

data:
  batch_size: 4096
  val_frac: 0.05

model:
  hidden_size: 3072
  latent_dim: 2048
  n_clusters: 128

loss:
  lambda_cluster: 0.1
  lambda_sep: 0.01
  lambda_usage: 0.1
  sinkhorn_iters: 3
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 15
  lr: 0.0001
  grad_clip: 1.0
  ema_decay: 0.99
  diag_every: 100
  reinit_every: 1000
  seed: 42
  wandb_project: "geosep-ae"
