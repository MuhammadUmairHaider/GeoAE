# Diagnostic: pure reconstruction, no clustering, no unit-norm constraint.
# Target: FVE should reach 0.85+ within 2000 steps.
# If it doesn't, the AE itself is broken (normalization, init, or optimizer).

extraction:
  n_tokens: 100000

model:
  n_clusters: 32     # irrelevant but keep small

loss:
  lambda_cluster: 0.0
  lambda_sep: 0.0
  lambda_usage: 0.0

train:
  n_epochs: 3
  diag_every: 50
  reinit_every: 99999   # disable
  seed: 42
  # unit-norm disabled via CLI flag --no_renorm
