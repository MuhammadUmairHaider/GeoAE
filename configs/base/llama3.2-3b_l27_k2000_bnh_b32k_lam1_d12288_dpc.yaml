# Llama-3.2-3B L27, K=2000, batch 32768 — DENSITY-PEAKS INIT, 4x LATENT (12288).
# Parent: llama3.2-3b_l27_k2000_bnh_b32k_lam1_d6144_dpc. ONE change:
#   model.latent_dim  6144 -> 12288  (4x hidden_size)
# Everything else — gelu, BN, dpc init, reinit peaks, every loss weight, the
# schedule, batch, lr, seed — is identical, so this completes a width series:
#   d3072 (1x)   d6144 (2x)   d12288 (4x)
#
# WHY. The d3072 arm was expected to shrink the AE-vs-base intervention gap toward
# zero (latent == hidden is close to a reparameterisation). It did the opposite:
# halving width AMPLIFIED the effect in both directions — a bigger AE win on DBpedia,
# a bigger loss on bias_in_bios, and the base-quality moderation went from rho −0.29
# to −0.77. If compression is the lever, 4x width should push the other way: smaller
# wins, smaller losses, a flatter moderation curve, and better reconstruction.
# If the effect does NOT flatten, width is not what drives it.
#
# CAVEAT FOR THE RANGE COMPARISONS. The top-30% salient set becomes 3686 z dims
# against 922 h dims — 4x the coordinates touched on the latent side (2x at d6144,
# 1x at d3072). Quote matched-erasure collateral, not fixed-alpha selectivity.
#
# COST (measured 2026-09-19 on the A100-40GB, batch 32768): 75.5M params, 17.5 GB
# peak GPU, 3.27 s/step vs 1.25 s at d6144 (the covariance term is quadratic in
# width) -> ~15.5 min/epoch compute, ~20 min/epoch with data/val overhead, ~17 h
# total. Checkpoints ~1 GB each; keep_checkpoints 40 -> ~40 GB of disk.
# dpc init on a 32768 x 12288 pool: 3.9 s, 6.7 GB.
#
# EVALUATE step_0014200.pt, NOT best_val.pt: on these configs val_mse rises once
# clustering starts at epoch 11, so best_val ends up a pre-clustering checkpoint
# with uninitialised centroids (epoch 10 on d3072, epoch 5 on dpc_tanh).
#
#   uv run python -u -m geoae.train \
#     --config configs/base/llama3.2-3b_l27_k2000_bnh_b32k_lam1_d12288_dpc.yaml \
#     | tee logs/llama_l27_bnh_b32k_lam1_d12288_dpc.log
#
# ---------------- parent header follows ----------------
# Llama-3.2-3B L27, K=2000, batch 32768 — DENSITY-PEAKS INIT (unsupervised).
# Parent: llama3.2-3b_l27_k2000_bnh_b32k_lam1_d6144_seeded. Changes are
# init-only: centroid_init seeded -> dpc, reinit_mode anchor -> peaks, and the
# anchor_*/atlas_* block is dropped. Every loss weight, the schedule, width,
# batch and lr are untouched, so this is directly comparable to both the seeded
# arm and the k-means++ grandparent.
#
# WHY.  Every init in this project so far is a farthest-point rule wearing a
# different hat. k-means++ samples proportional to D^2 — the distance to the
# nearest ALREADY-SELECTED centroid — which by construction chases outliers. The
# seeded arm's fill maximises density(x) * D^2, which was supposed to fix that,
# and did not: measured on the parent checkpoint, its picks sat at density
# 0.0105 against a pool median of 0.0173. Still BELOW-median density. The D^2
# term grows without bound as the selected set spreads out, while the density
# weight is a bounded median-normalised ratio, so coverage always wins in the
# end. Raising density_power fights the symptom, not the mechanism.
#
# Density peaks (Rodriguez & Laio, Science 2014) removes the coverage term:
#     gamma_i = rho_i^density_power * delta_i
# where delta_i is the distance to the nearest point of strictly HIGHER density,
# not to the nearest selected one. That single change flips the selection:
#   mode centre   high rho, large delta (nothing denser nearby)   -> picked
#   mode tail     decent rho, ~zero delta (denser point uphill)   -> skipped
#   outlier       large delta, ~zero rho                          -> skipped
# Peaks also self-separate for free — two points on one mode cannot both have a
# large delta, since one is uphill of the other — so peak_min_sep_frac is only a
# near-duplicate guard, not the spreading mechanism.
#
# NO LABELS, NO ANCHOR CACHE. Unlike the seeded arm this needs no concept cache,
# so there is no layer-coupling trap (cache/ is L27, cache_l14/ is L14) and no
# evaluation contamination: score it WITHOUT `concept_probe --exclude_anchors`,
# since no eval row was consumed as a seed. It also ports unchanged to the
# Gemma/Qwen tracks, where no concept cache exists.
#
# WHAT TO CHECK AT EPOCH 11. The init prints one line:
#     density pct of picks: NNth (pool median = 50th) | peaks: N/2000 | min sep: N.NNx typical
#   density pct  THE number. Above 50 means the density term actually took over;
#                the coverage fill this replaces measured below it. If this comes
#                out under 50, raise density_power to 2.0-3.0 before concluding
#                the idea does not work.
#   peaks        picks whose nearest denser point lies outside their own kNN
#                radius, i.e. genuine local maxima. This doubles as a measurement
#                of HOW MANY MODES THE LATENT SPACE HAS. A low count against
#                K=2000 is a finding about the space, not a bug — recall raw
#                k-means at K=2000 realises only ~292 effective clusters. On
#                synthetic data with 400 true modes this reported exactly 400.
#   min sep      as a multiple of the median kNN radius; under ~0.1 means
#                centroids are landing on top of each other, so set
#                peak_refine_k: 0 to place them on the exact peak points.
#
# COST. The delta scan is O(N^2) in density_pool. At 32768 x 6144 it is ~2.4 s
# and ~270 MB of working memory on one card — a one-off at epoch 11. Raising
# density_pool is quadratic in time and linear in footprint (1.6 GB at 65536).
#
#   uv run python -u -m geoae.train \
#     --config configs/base/llama3.2-3b_l27_k2000_bnh_b32k_lam1_d6144_dpc.yaml \
#     | tee logs/llama_l27_bnh_b32k_lam1_d6144_dpc.log

extraction:
  model_name: "meta-llama/Llama-3.2-3B"   # metadata only — no LM is loaded here

data:
  activations_dir: "activations_diverse_10M"   # same dump as the parent + the KL twin
  target_layer: 27
  batch_size: 32768         # B/K = 16.4; 3 arms fit concurrently on one 42 GB card
  val_frac: 0.05            # -> 9.33M train / 491k val, same split as the parent

model:
  hidden_size: 3072
  latent_dim: 12288          # see header
  latent_norm: "batch"      # BatchNorm1d between encoder linear and GELU
  n_clusters: 2000
  nonlinearity: gelu
  metric: euclidean

# CLUSTERING/SEPARATION STRENGTH (2nd deliberate change, on top of latent_dim).
# At the parent's weights these terms barely participate: measured at init,
# recon 1.535 / cluster 0.451 / sep 0.366, so lambda_cluster 0.05 contributes
# 1.3% of the loss and lambda_sep 0.005 contributes 0.1%. Raised here to
# lambda_cluster 0.5 (10x) and lambda_sep 0.3 (60x), giving roughly 11% and 5%
# of the loss at init. lambda_sep 0.3 has precedent in this project
# (kl_gelu_k1000_sep0.3).
#
# NOTE ON THE RAMP: lambda_sep rises LINEARLY from 0 at full_loss_start_epoch to
# its nominal value only at n_epochs (train_common.lambda_schedule:94), so its
# average weight across epochs 11-50 is about HALF of 0.3, and it only reaches
# full strength in the last epoch. lambda_cluster has no ramp — it applies at
# 0.5 from epoch 11. If separation needs to bite earlier, the knob is
# full_loss_start_epoch, not lambda_sep.
#
# These shares are measured at INITIALISATION; cluster_loss and sep_loss both
# shrink as training improves them, so the realised shares will drift down.
#
# THE FAILURE MODE TO WATCH.  cluster_loss rewards pulling latents toward their
# centroid, i.e. it rewards CONTRACTION of the whole latent space, and sep_loss
# uses an adaptive sigma which makes it scale-invariant — so sep cannot resist
# contraction no matter how large lambda_sep is. The ONLY counter-pressure is the
# VICReg variance hinge, lambda_var. A 10x cluster weight against an unchanged
# lambda_var 0.3 is the risky part of this config.
#
# Detectable by epoch ~13 (first diagnostics after clustering starts at 11):
# watch cluster/intra_var falling steadily and the latent norm shrinking. If that
# happens, raise lambda_var to 0.5-1.0 and restart — do not wait for epoch 50.
# Reminder that the W&B silhouette/entropy panels are NOT usable for this call;
# they measure the Sinkhorn output on one batch.
# LOSS WEIGHTS CHOSEN FROM THE lambda SWEEP (geoae.interp.lambda_sweep, 2026-08-30).
#
# lambda_cluster 2.0, NOT the 0.5 that looked like the knee. The sweep runs 10
# epochs on 1.5M rows and so understates FVE: at lambda 0.05 it reaches 0.916
# where a full run reaches ~0.998. Applying that ~0.09-0.15 offset, lambda 0.5
# would land a full run back at FVE ~0.94-1.00 — the near-identity regime where
# the encoder has already been shown to do nothing (balanced k-means with no
# encoder matches it). lambda 2.0 projects to ~0.78-0.84, far enough from
# identity that the encoder is forced to distort rather than copy. That is the
# whole point of the run: at 0.5 we would reproduce the null instead of testing it.
#
# lambda_var 1.0 (up from 0.3). The sweep shows the variance term failing as
# clustering strengthens — var loss 0.017 -> 0.045 -> 0.111 -> 0.694 at
# lambda_cluster 0.05 -> 0.5 -> 2.0 -> 8.0. cluster_loss rewards contraction and
# there is no norm layer, so lambda_var is the only counter-pressure; leaving it
# at 0.3 against a 40x-stronger cluster term is how this run collapses.
#
# lambda_cov 0.01 (up from 0.001). Covariance blew from 15.9 to 76.6 over the
# same range: the latent is becoming correlated, i.e. drifting low-rank.
#
# lambda_sep 0.3 is INERT and kept only for parity with the parent. Measured
# across a 240x range of lambda_sep the converged value moves by 0.01, because
# sigma^2 = median(d^2) makes sep_loss homogeneous of degree 2 and therefore
# scale-free. It is not a knob until sep_loss is reformulated (fixed sigma,
# intra-cluster-normalised sigma, or a hinge on the minimum pair distance).
#
# latent_norm stays "none" pending the BN arm of the sweep, which tests whether
# BatchNorm holds the variance where lambda_var cannot.
loss:
  lambda_cluster: 1.0       # see header
  lambda_sep: 0.3           # now a LIVE knob under sep_mode: hinge
  sep_mode: "hinge"         # relu(margin*r_intra - d)^2; median is scale-free
  sep_margin: 2.0           # target d_min >= 2 x mean intra-cluster radius
  lambda_var: 1.0           # raised from 0.3 — sole defence against contraction
  lambda_cov: 0.01          # raised from 0.001 — cov blew 15.9->76.6 in the sweep
  lambda_unif: 0.0          # euclidean run: uniformity is for the cosine geometry
  lambda_usage: 0.05        # unused by total_loss; config parity
  lambda_mse: 0.0           # unused here — total_loss carries MSE at weight 1.0

  balance: "zipf"
  balance_rho: 0.6
  balance_eta: 0.05
  zipf_alpha_start: 0.0
  zipf_alpha_end: 0.5

  sinkhorn_iters: 3
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 50
  lr: 2.8e-4                   # sqrt(8) scaling for the 8x larger batch
  recon_only_epochs: 10        # no cluster loss until epoch 11 (lambda_schedule gate)
  geometry_start_epoch: 6      # epochs 6-10 : + VICReg (var/cov), clustering still off
  clustering_start_epoch: 11   # epochs 11+  : + cluster loss, centroids seeded here
  full_loss_start_epoch: 11    # sep ramps from 0; tau and zipf_alpha anneal from here
  ema_decay: 0.9
  ema_hard: true
  centroid_init: "dpc"         # <<< density peaks: rho^a * delta, no coverage term
  density_power: 1.0           # the `a` above; 0 = rank by delta alone (outlier-seeking)
  density_pool: 32768          # latents encoded for the estimate; delta is O(N^2) in this
  density_knn: 32              # k for the kNN density rho
  peak_min_sep_frac: 0.25      # near-duplicate guard, as a fraction of the median kNN radius
  peak_refine_k: 8             # centroid = mean of 8 NNs, not the single peak point
  reinit_mode: "peaks"         # <<< dead clusters reseed onto batch peaks, not high-loss rows
  peak_reinit_pool: 8192       # rows used per reinit cycle; O(N^2), and this fires often
  checkpoints_dir: "checkpoints/llama3.2-3B/layer27/k2000_bnh_b32k_lam1_d12288_dpc"
  diag_every: 12            # 284 steps/epoch now, not 2278
  reinit_every: 125         # was 1000 steps = 0.44 epoch at B=4096
  save_every: 1             # the trajectory analyses need every epoch
  keep_checkpoints: 40      # default 3 would rotate the trajectory away
  seed: 42
  wandb_project: "geosep-general-e2e"
