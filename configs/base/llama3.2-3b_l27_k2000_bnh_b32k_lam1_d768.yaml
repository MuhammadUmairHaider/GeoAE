# Llama-3.2-3B L27, K=2000, batch 32768 — BOTTLENECK ARM, latent 768 (0.25x hidden).
# Parent: llama3.2-3b_l27_k2000_bnh_b32k_lam1_d6144.  SOLE CHANGE: latent_dim 6144 -> 768.
#
# WHY. Every llama L27 run in this repo has had latent_dim >= hidden_size (3072/3072
# or 6144/3072). The only sub-1.0 ratio anywhere in configs/ is default.yaml, which
# nothing was trained from. There is also no sparsity term: losses.py's l1_loss acts
# on cluster USAGE, not on the latent. The code states the consequence itself at
# losses.py:358 -- "with latent_dim == hidden_size and no sparsity term,
# reconstruction alone is minimised by drifting toward identity".
#
# The parent run confirmed it exactly: FVE 0.969, effective rank 165 of a possible
# 1999 on the centroids and 546 of 6144 on the latents (both ~9%), and a covariance
# term sitting 52x above its achievable floor (9.84 measured vs 0.19 for decorrelated
# noise of the same shape and scale). It is close to an invertible reparameterisation.
#
# SO EVERY "the encoder adds nothing over balanced k-means" RESULT SO FAR HAS BEEN
# MEASURED ON AN ENCODER THAT WAS NEVER REQUIRED TO DISCARD ANYTHING. 768 dimensions
# cannot carry 3072, so this one has to choose what to keep. That is the untested
# variable behind the whole series of null results.
#
# NOT AN SAE: no TopK, no JumpReLU, no L1 on the latent. A plain dense bottleneck,
# deliberately, so exactly one variable moves against the parent.
#
# lambda_cov STAYS AT 0.01 even though the parent showed it is far too weak. Raising
# it here would make this a two-variable diff, and the rank-collapse it was meant to
# fix may simply not arise at 768 dims -- there is no spare capacity to be redundant
# with. Test lambda_cov separately (see ..._d6144_cov01.yaml).
#
# WHAT TO WATCH
#   * FVE must fall WELL BELOW 0.9. If it does not, 768 is still not binding and the
#     next step is 384. The parent sat at 0.969.
#   * Judge on TOKEN-WEIGHTED word intrusion, not on semantic coherence: 96% of
#     clusters score 4-5 on that 1-5 scale in every space measured so far, so it is
#     saturated and cannot show an improvement. Compare against balanced k-means
#     (token-weighted intrusion 0.363) and the parent (0.314).
#   * Do NOT judge cluster health before epoch ~40. The parent oscillated between
#     healthy and 83%-of-tokens-in-one-cluster over epochs 15-30 and self-resolved.
#
#   uv run python -u -m geoae.train \
#     --config configs/base/llama3.2-3b_l27_k2000_bnh_b32k_lam1_d768.yaml \
#     | tee logs/llama_l27_bnh_b32k_lam1_d768.log

extraction:
  model_name: "meta-llama/Llama-3.2-3B"   # metadata only — no LM is loaded here

data:
  activations_dir: "activations_diverse_10M"   # same dump as the parent + the KL twin
  target_layer: 27
  batch_size: 32768         # B/K = 16.4; 3 arms fit concurrently on one 42 GB card
  val_frac: 0.05            # -> 9.33M train / 491k val, same split as the parent

model:
  hidden_size: 3072
  latent_dim: 768             # <<< THE CHANGE: 6144 -> 768 (0.25x hidden)
  latent_norm: "batch"      # BatchNorm1d between encoder linear and GELU
  n_clusters: 2000
  nonlinearity: gelu
  metric: euclidean

# CLUSTERING/SEPARATION STRENGTH (2nd deliberate change, on top of latent_dim).
# At the parent's weights these terms barely participate: measured at init,
# recon 1.535 / cluster 0.451 / sep 0.366, so lambda_cluster 0.05 contributes
# 1.3% of the loss and lambda_sep 0.005 contributes 0.1%. Raised here to
# lambda_cluster 0.5 (10x) and lambda_sep 0.3 (60x), giving roughly 11% and 5%
# of the loss at init. lambda_sep 0.3 has precedent in this project
# (kl_gelu_k1000_sep0.3).
#
# NOTE ON THE RAMP: lambda_sep rises LINEARLY from 0 at full_loss_start_epoch to
# its nominal value only at n_epochs (train_common.lambda_schedule:94), so its
# average weight across epochs 11-50 is about HALF of 0.3, and it only reaches
# full strength in the last epoch. lambda_cluster has no ramp — it applies at
# 0.5 from epoch 11. If separation needs to bite earlier, the knob is
# full_loss_start_epoch, not lambda_sep.
#
# These shares are measured at INITIALISATION; cluster_loss and sep_loss both
# shrink as training improves them, so the realised shares will drift down.
#
# THE FAILURE MODE TO WATCH.  cluster_loss rewards pulling latents toward their
# centroid, i.e. it rewards CONTRACTION of the whole latent space, and sep_loss
# uses an adaptive sigma which makes it scale-invariant — so sep cannot resist
# contraction no matter how large lambda_sep is. The ONLY counter-pressure is the
# VICReg variance hinge, lambda_var. A 10x cluster weight against an unchanged
# lambda_var 0.3 is the risky part of this config.
#
# Detectable by epoch ~13 (first diagnostics after clustering starts at 11):
# watch cluster/intra_var falling steadily and the latent norm shrinking. If that
# happens, raise lambda_var to 0.5-1.0 and restart — do not wait for epoch 50.
# Reminder that the W&B silhouette/entropy panels are NOT usable for this call;
# they measure the Sinkhorn output on one batch.
# LOSS WEIGHTS CHOSEN FROM THE lambda SWEEP (geoae.interp.lambda_sweep, 2026-08-30).
#
# lambda_cluster 2.0, NOT the 0.5 that looked like the knee. The sweep runs 10
# epochs on 1.5M rows and so understates FVE: at lambda 0.05 it reaches 0.916
# where a full run reaches ~0.998. Applying that ~0.09-0.15 offset, lambda 0.5
# would land a full run back at FVE ~0.94-1.00 — the near-identity regime where
# the encoder has already been shown to do nothing (balanced k-means with no
# encoder matches it). lambda 2.0 projects to ~0.78-0.84, far enough from
# identity that the encoder is forced to distort rather than copy. That is the
# whole point of the run: at 0.5 we would reproduce the null instead of testing it.
#
# lambda_var 1.0 (up from 0.3). The sweep shows the variance term failing as
# clustering strengthens — var loss 0.017 -> 0.045 -> 0.111 -> 0.694 at
# lambda_cluster 0.05 -> 0.5 -> 2.0 -> 8.0. cluster_loss rewards contraction and
# there is no norm layer, so lambda_var is the only counter-pressure; leaving it
# at 0.3 against a 40x-stronger cluster term is how this run collapses.
#
# lambda_cov 0.01 (up from 0.001). Covariance blew from 15.9 to 76.6 over the
# same range: the latent is becoming correlated, i.e. drifting low-rank.
#
# lambda_sep 0.3 is INERT and kept only for parity with the parent. Measured
# across a 240x range of lambda_sep the converged value moves by 0.01, because
# sigma^2 = median(d^2) makes sep_loss homogeneous of degree 2 and therefore
# scale-free. It is not a knob until sep_loss is reformulated (fixed sigma,
# intra-cluster-normalised sigma, or a hinge on the minimum pair distance).
#
# latent_norm stays "none" pending the BN arm of the sweep, which tests whether
# BatchNorm holds the variance where lambda_var cannot.
loss:
  lambda_cluster: 1.0       # see header
  lambda_sep: 0.3           # now a LIVE knob under sep_mode: hinge
  sep_mode: "hinge"         # relu(margin*r_intra - d)^2; median is scale-free
  sep_margin: 2.0           # target d_min >= 2 x mean intra-cluster radius
  lambda_var: 1.0           # raised from 0.3 — sole defence against contraction
  lambda_cov: 0.01          # raised from 0.001 — cov blew 15.9->76.6 in the sweep
  lambda_unif: 0.0          # euclidean run: uniformity is for the cosine geometry
  lambda_usage: 0.05        # unused by total_loss; config parity
  lambda_mse: 0.0           # unused here — total_loss carries MSE at weight 1.0

  balance: "zipf"
  balance_rho: 0.6
  balance_eta: 0.05
  zipf_alpha_start: 0.0
  zipf_alpha_end: 0.5

  sinkhorn_iters: 3
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 50
  lr: 2.8e-4                   # sqrt(8) scaling for the 8x larger batch
  recon_only_epochs: 10        # no cluster loss until epoch 11 (lambda_schedule gate)
  geometry_start_epoch: 6      # epochs 6-10 : + VICReg (var/cov), clustering still off
  clustering_start_epoch: 11   # epochs 11+  : + cluster loss, centroids kmeans++ seeded
  full_loss_start_epoch: 11    # sep ramps from 0; tau and zipf_alpha anneal from here
  ema_decay: 0.9
  ema_hard: true
  centroid_init: "kmeans++"
  checkpoints_dir: "checkpoints/llama3.2-3B/layer27/k2000_bnh_b32k_lam1_d768"
  diag_every: 12            # 284 steps/epoch now, not 2278
  reinit_every: 125         # was 1000 steps = 0.44 epoch at B=4096
  save_every: 1             # the trajectory analyses need every epoch
  keep_checkpoints: 40      # default 3 would rotate the trajectory away
  seed: 42
  wandb_project: "geosep-general-e2e"
