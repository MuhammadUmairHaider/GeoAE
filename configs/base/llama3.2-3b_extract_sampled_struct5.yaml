# Exactly 10,000,000 training rows plus a separate 5% validation tail.
# Required ten-source struct5 mix; floor(10,526,316 * 0.95) = 10,000,000.
extraction:
  model_name: meta-llama/Llama-3.2-3B
  layers:
  - 27
  target_layer: 27
  hidden_size: 3072
  n_tokens: 10526316
  dtype: float16
  activations_dir: activations_sampled_struct5_train10M
  corpus_dir: corpus/sampled_v1
  corpus_margin: 1.3
  mode: sampled
  context_len: 2048
  positions_per_doc: 64
  skip_leading: 4
  batch_docs: 16
  shuffle_buffer: 2000
  outlier_norm_mult: 0.0
  log_every: 2000
  sources:
  - domain: edu_web
    weight: 35
    name: HuggingFaceFW/fineweb-edu
    config: sample-10BT
    field: text
  - domain: web
    weight: 15
    name: HuggingFaceFW/fineweb
    config: sample-10BT
    field: text
  - domain: wiki
    weight: 15
    name: wikimedia/wikipedia
    config: 20231101.en
    field: text
  - domain: pile
    weight: 10
    name: monology/pile-uncopyrighted
    field: text
    shuffle_buffer: 1000
    exclude:
      key: meta.pile_set_name
      values:
      - Pile-CC
      - Github
      - DM Mathematics
      - Wikipedia (en)
  - domain: code
    weight: 8
    name: codeparrot/codeparrot-clean
    field: content
  - domain: math
    weight: 5
    name: HuggingFaceTB/finemath
    config: finemath-4plus
    field: text
  - domain: wiki_de
    weight: 3
    name: wikimedia/wikipedia
    config: 20231101.de
    field: text
  - domain: wiki_fr
    weight: 2
    name: wikimedia/wikipedia
    config: 20231101.fr
    field: text
  - domain: wiki_es
    weight: 2
    name: wikimedia/wikipedia
    config: 20231101.es
    field: text
  - domain: structured
    weight: 5
    kind: structured
    items_per_doc: 8
