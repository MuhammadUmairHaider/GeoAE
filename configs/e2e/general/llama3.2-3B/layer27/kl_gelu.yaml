# End-to-end KL — GENERAL corpus (the original use case), UNSUPERVISED.
# Llama-3.2-3B, layer 27 (FINAL layer), ~5M token-level activations (C4 + cc_news).
#
# Faithfulness = forward KL on next-token logits. Teacher is computed ON-THE-FLY as
# head(norm(x)) in the training loop (teacher_mode: onfly) — at 5M tokens a cached
# teacher_logits file would be ~1.28 TB, so no cache is used. No labels: kmeans++
# init, evaluate with the causal-validation path (geosep/evaluate.py), not cluster↔class.
#
# Prereq: general activations already extracted to geosep/activations/ (layer_27.npy).
#   (one-time) python geosep/extract_activations.py --config geosep/configs/full_run_v2.yaml

extraction:
  model_name: "meta-llama/Llama-3.2-3B"   # REQUIRED for e2e — the LLM is in the loop

data:
  activations_dir: "activations_diverse"   # -> geosep/activations_diverse (4.9M tok, web+wiki+code+math)
  target_layer: 27
  batch_size: 512                  # (B, vocab) logits + backward through lm_head
  val_frac: 0.05

model:
  hidden_size: 3072
  latent_dim: 3072                 # no bottleneck
  n_clusters: 128
  nonlinearity: gelu

loss:
  lambda_cluster: 0.01
  lambda_sep: 0.005
  lambda_usage: 0.05               # unused by e2e loss; kept for config parity
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 20
  recon_only_epochs: 5             # "KL-only" warmup (cluster/sep phase in after)
  clustering_start_epoch: 6
  full_loss_start_epoch: 9
  teacher_mode: "onfly"            # head(norm(x)) in-loop — no teacher-logit cache
  centroid_init: "kmeans++"        # unsupervised (no labels for the general corpus)
  checkpoints_dir: "e2e/checkpoints/general/llama3.2-3B/layer27/kl_gelu"
  diag_every: 100
  reinit_every: 1000
  seed: 42
  wandb_project: "geosep-general-e2e"
