# End-to-end KL — GENERAL corpus, UNSUPERVISED — geometry-losses-at-strength variant.
# Same as kl_gelu.yaml except the clustering geometry actually participates in the
# gradient. Rationale (gradient audit at the kl_gelu_2000 checkpoint):
#   lambda_cluster 0.01 -> 0.5% of encoder gradient (decorative). 0.2 -> ~10%.
#   lambda_mse 0.05 adds the reconstruction anchor (~3%) the e2e loss supports.
#   K=256: every granularity signal (baseline effective-K ~292, 848 distinct top
#   tokens at K=2000, centroid rank ~37) points at low hundreds, not thousands.

extraction:
  model_name: "meta-llama/Llama-3.2-3B"   # REQUIRED for e2e — the LLM is in the loop

data:
  activations_dir: "activations_diverse"
  target_layer: 27
  batch_size: 2048
  val_frac: 0.05

model:
  hidden_size: 3072
  latent_dim: 3072                 # no bottleneck
  n_clusters: 2000
  nonlinearity: gelu

loss:
  lambda_cluster: 0.2              # was 0.01 (0.5% grad share) -> ~10% share
  lambda_sep: 0.005                # unchanged: its problem is shape (saturates), not weight
  lambda_mse: 0.05                 # reconstruction anchor, was 0.0
  lambda_usage: 0.05               # unused by e2e loss; kept for config parity
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 50
  recon_only_epochs: 5             # KL(+mse)-only warmup
  clustering_start_epoch: 6
  full_loss_start_epoch: 9
  teacher_mode: "onfly"
  centroid_init: "kmeans++"
  checkpoints_dir: "e2e/checkpoints/general/llama3.2-3B/layer27/kl_gelu_k2000_geo"
  diag_every: 100
  reinit_every: 1000
  seed: 42
  wandb_project: "geosep-general-e2e"
