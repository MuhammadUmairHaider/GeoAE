# The stage description in the lines above belongs to the previous (staged) campaign config this file was derived from.
extraction:
  model_name: google/gemma-3-4b-pt
data:
  activations_dir: activations_gemma3_4b_sampled_struct5_10M
  target_layer: 33
  batch_size: 32768
  val_frac: 0.05
model:
  hidden_size: 2560
  latent_dim: 5120
  latent_norm: batch
  n_clusters: 2000
  nonlinearity: gelu
  metric: euclidean
  token_bias: ""
loss:
  lambda_cluster: 1.0
  lambda_sep: 0.3
  sep_mode: hinge
  sep_margin: 2.0
  lambda_var: 1.0
  lambda_cov: 0.01
  lambda_unif: 0.0
  lambda_usage: 0.05
  lambda_mse: 0.0
  balance: none
  balance_rho: 0.6
  balance_eta: 0.05
  zipf_alpha_start: 0.0
  zipf_alpha_end: 0.5
  sinkhorn_iters: 3
  tau_start: 1.0
  tau_end: 0.1
train:
  n_epochs: 50
  lr: 0.00028
  recon_only_epochs: 0
  geometry_start_epoch: 1
  clustering_start_epoch: 1
  full_loss_start_epoch: 1
  ema_decay: 0.9
  ema_hard: true
  centroid_init: dpc
  density_power: 1.0
  density_pool: 32768
  density_knn: 32
  peak_min_sep_frac: 0.25
  peak_refine_k: 8
  reinit_mode: peaks
  peak_reinit_pool: 8192
  checkpoints_dir: checkpoints/gemma3-4B/layer33/k2000_bnh_b32k_lam1_d5120_dpc_sampled_struct5_nobypass_nobal_nostage_e50
  diag_every: 144
  reinit_every: 125
  reinit_threshold: 0.05
  save_every: 1
  keep_checkpoints: 4
  keep_every_epochs: 10
  seed: 42
  wandb_project: geoae-gemma3-4b
