# Exact completed paper linear checkpoint recipe; only activation mount is localized.
data:
  activations_dir: activations_sampled_10M
  batch_size: 32768
  target_layer: 27
  val_frac: 0.05
extraction:
  activations_dir: activations
  batch_docs: 16
  context_len: 2048
  corpus_dir: ''
  corpus_margin: 1.3
  data_sources:
  - allenai/c4
  - wikipedia
  - bookcorpus
  - codeparrot/github-code
  - cc_news
  - togethercomputer/RedPajama-Data-1T-Sample
  dtype: float16
  hidden_size: 3072
  layers:
  - 16
  - 20
  - 24
  - 27
  log_every: 10
  max_doc_tokens: 256
  min_doc_len: 10
  mode: prefix
  model_name: meta-llama/Llama-3.2-3B
  n_tokens: 5000000
  outlier_norm_mult: 0.0
  pack_size: 16384
  positions_per_doc: 64
  shuffle_buffer: 10000
  skip_first_n: 8
  skip_leading: 4
  sources: []
  target_layer: 27
loss:
  balance: zipf
  balance_eta: 0.05
  balance_rho: 0.6
  lambda_cluster: 1.0
  lambda_cov: 0.01
  lambda_mse: 0.0
  lambda_sep: 0.3
  lambda_sup: 0.0
  lambda_unif: 0.0
  lambda_usage: 0.05
  lambda_var: 1.0
  sep_margin: 2.0
  sep_mode: hinge
  sinkhorn_iters: 3
  tau_end: 0.1
  tau_start: 1.0
  var_gamma: 1.0
  zipf_alpha_end: 0.5
  zipf_alpha_start: 0.0
model:
  dist_scale: raw
  hidden_size: 3072
  latent_dim: 6144
  latent_norm: batch
  metric: euclidean
  n_clusters: 2000
  nonlinearity: gelu
  token_bias: e2e/checkpoints/general/llama3.2-3B/layer27/token_bias_sampled.npz
train:
  anchor_cache: cache
  anchor_mean_k: 5
  anchor_min_examples: 5
  anchor_per_class: 25
  anchor_rungs: ''
  atlas_last: ''
  atlas_min_examples: 25
  betas:
  - 0.9
  - 0.999
  centroid_init: dpc
  checkpoints_dir: checkpoints/llama3.2-3B/layer27/k2000_bnh_b32k_lam1_d6144_dpc_sampled_tokbias
  clustering_start_epoch: 11
  density_knn: 32
  density_pool: 32768
  density_power: 1.0
  diag_every: 12
  ema_decay: 0.9
  ema_hard: true
  fill_mode: coverage
  freeze: none
  full_loss_start_epoch: 11
  geometry_start_epoch: 6
  grad_clip: 1.0
  keep_checkpoints: 40
  lr: 0.00028
  n_epochs: 50
  peak_min_sep_frac: 0.25
  peak_refine_k: 8
  peak_reinit_pool: 8192
  recon_only_epochs: 10
  reinit_every: 125
  reinit_mode: peaks
  runs_dir: runs
  save_every: 1
  seed: 42
  semisup_cap: 500
  sup_cache: cache
  sup_frac: 0.0
  sup_holdout_classes: 0.2
  sup_holdout_rows: 0.2
  sup_m_per_class: 8
  sup_min_examples: 10
  sup_per_class: 500
  sup_rungs: ''
  sup_temperature: 0.1
  teacher_mode: cached
  wandb_entity: null
  wandb_project: geosep-general-e2e
  weight_decay: 0.0
