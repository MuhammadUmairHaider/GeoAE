data:
  activations_dir: "dbpedia/activations/Qwen3.5-9B/last/unprompted"
  target_layer: 31
  batch_size: 512
  val_frac: 0.05

model:
  hidden_size: 4096
  latent_dim: 4096
  n_clusters: 14
  nonlinearity: gelu

loss:
  lambda_cluster: 0.01
  lambda_sep: 0.005
  lambda_usage: 0.05
  tau_start: 1.0
  tau_end: 0.1

train:
  n_epochs: 40
  recon_only_epochs: 10
  clustering_start_epoch: 11
  full_loss_start_epoch: 15
  checkpoints_dir: "dbpedia/checkpoints/Qwen3.5-9B/layer31/unprompted_last_gelu"
  diag_every: 100
  reinit_every: 1000
  seed: 42
  wandb_project: "geosep-dbpedia"
