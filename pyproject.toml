[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoae"
version = "0.1.0"
description = "GeoAE concept-cluster autoencoder for LLM residual streams."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch", "transformers", "accelerate", "datasets", "numpy", "pyyaml",
    "scikit-learn", "scipy", "matplotlib", "sentencepiece", "protobuf", "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "wandb", "ruff"]
sae = ["einops==0.8.2"]
judges = ["openai", "anthropic"]
plots = ["umap-learn"]

[project.scripts]
geoae = "geoae.cli:main"
geoae-train = "geoae.training.mse:main"
geoae-extract = "geoae.extraction.prefix:main"
geoae-evaluate = "geoae.evaluation.faithfulness:main"
geoae-pipeline = "geoae.workflow.pipeline:main"
geoae-e2e-extract = "geoae.extraction.logits:main"
geoae-e2e-train = "geoae.training.kl_cached:main"
geoae-e2e-train-stream = "geoae.training.kl_stream:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geoae*", "experiments*"]

[tool.setuptools.package-data]
geoae = ["baselines/matched_topk/_reference/SOURCE.json", "baselines/matched_topk/requirements.txt"]
experiments = ["**/*.yaml", "**/*.yml", "**/*.sh", "**/*.sbatch", "**/*.html", "config_paths.json"]

[tool.setuptools.data-files]
"share/geoae/configs/examples" = ["configs/examples/*.yaml"]
"share/geoae/configs/sites" = ["configs/sites/*.sh", "configs/sites/*.md", "configs/sites/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
# Upstream reference code is pinned byte-for-byte; lint maintained adapters instead.
extend-exclude = ["geoae/baselines/matched_topk/_reference"]

[tool.ruff.lint]
# F: pyflakes (unused imports/variables, undefined names), E7/E9: pycodestyle errors
select = ["F", "E7", "E9"]
# E70x: compact `a = 1; b = 2` lines are deliberate idiom in this codebase
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Tests instantiate objects for side effects and keep explanatory constants
"tests/*" = ["F841"]
